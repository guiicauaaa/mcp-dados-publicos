name: CD

# Publica as imagens no GitHub Container Registry depois que o CI passa num push na main.
# Não existe servidor para implantar: o modelo roda no Ollama da máquina de quem usa. Com os pacotes
# públicos, `docker compose pull` e `docker compose up -d` dispensam o build local.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Publicações em fila, nunca em paralelo: uma execução antiga não sobrescreve o :latest de uma nova.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar ${{ matrix.image }}
    # Só o CI de um PUSH na main deste repositório: um PR (inclusive de fork com branch "main") nunca publica.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: app
            dockerfile: src/PublicData.Api/Dockerfile
          - image: mcp-server
            dockerfile: src/PublicData.McpServer/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
          # O label de revisão aponta para o commit compilado (head_sha), não para o github.sha do evento
          # workflow_run. (context: git não serve aqui: o checkout de um SHA deixa o HEAD destacado.)
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
