version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /src/PublicData.Web
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
    ignore:
      # Versões principais (Angular, TypeScript, Vitest) sobem juntas com `ng update`, não uma a uma.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /src/PublicData.Api
    schedule:
      interval: monthly
    ignore:
      # Fica no Node LTS (24); versões ímpares não são LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /src/PublicData.McpServer
    schedule:
      interval: monthly
