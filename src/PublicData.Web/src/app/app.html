      <rect x="2" y="2" width="12" height="12" rx="2" />
      <rect x="18" y="2" width="12" height="12" rx="2" class="alt" />
      <rect x="18" y="18" width="12" height="12" rx="2" />

    <span class="names">
      <span class="name">Assistente de Dados Públicos</span>
      <span class="tagline">IA local (Ollama) · MCP · .NET 10</span>

  <nav aria-label="Principal">
